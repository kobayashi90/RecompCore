# GBSJ8P- BEACH SPIKERS

[Core]
# Values set here will override the main Dolphin settings.

[OnFrame]
# Add memory patches to be applied every frame here.

[ActionReplay]
# NTSC-J codes by Codejunkies, taken from GameHacking.org's Japan entry
# (game/55737, CRC32 A71E628A). That listing only ever published the encrypted
# ARMax form -- there is no decrypted "Plain Text" export for the Japanese disc
# the way there is for GBSE8P -- so these stay encrypted and Dolphin decrypts
# them with ARDecrypt at load time. The format is the same 13-character
# "XXXX-XXXX-XXXXX" ARMax encoding the PAL set in GBSP8P.ini already uses; it is
# not the same encoding as the plain-hex NTSC-U set.
#
# They live in GBSJ8P.ini and not in GBS.ini on purpose: GBS.ini is loaded for
# every Beach Spikers region, so a code parked there would also be offered to
# (and applied to) a PAL or NTSC-U disc at Japanese addresses. The master code
# from the original listing ("WK7H-T1KN-6A8RQ / 08W1-487F-48719") is omitted
# because Dolphin needs no master code and warns against enabling one.
#
# Unlike the PAL and NTSC-U sets, the Japanese listing has no "Unlock
# Everything" code: the eleven codes below are all that was ever published.
# The unlock content is still reachable in-game through the multilingual
# name-entry passwords (DAYTONA, JUSTICE, OHTORII, FVIPERS, ARAKATA, PHANTA2,
# VDF5PS), which work identically on this region.
