# GBSE8P- BEACH SPIKERS

[Core]
# Values set here will override the main Dolphin settings.

[OnFrame]
# Add memory patches to be applied every frame here.

[ActionReplay]
# NTSC-U codes by Codejunkies, taken from GameHacking.org's decrypted
# "Plain Text" export for GBSE8P rather than from the encrypted listings.
#
# The cheathappens.com set of January 2003 decrypts to garbage: every block
# fails Datel's CRC, so Dolphin (which only warns and applies whatever came
# out) would write nonsense into the game's memory. These lines are plain hex,
# which Dolphin loads without any decryption step at all.
#
# They are in GBSE8P.ini and not in GBS.ini on purpose: GBS.ini is loaded for
# every Beach Spikers region, so a code parked there would also be offered to
# (and applied to) the PAL disc at NTSC-U addresses. The master code from the
# original listing is omitted because Dolphin needs no master code.
#
# The three score codes are "while the button is held" jokers: 2828xxxx is a
# 16-bit compare against the controller state (40 = L, 80 = R, 100 = down), and
# the line after it writes the score byte itself.
$Left team score 15 (hold L)
282800FA 00000040
00281E89 0000000F
$Right team score 15 (hold R)
282800FA 00000080
00281E8F 0000000F
$Left team score 1 (hold L + Down)
282800FA 00000140
00281E89 00000001
$Right team score 1 (hold R + Down)
282800FA 00000180
00281E8F 00000001
$Max stats (partner)
0021D050 00000027
$Max teamwork
0421D05C 00640000
042C57C8 42C80000
$Max world tour points
02289D52 000003E7
$All world tour levels open
