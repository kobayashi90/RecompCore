[ActionReplay]
# Beach Spikers cheats by Ralf (gc-forever.com/forums/viewtopic.php?t=3106).
#
# These are PAL codes and are deliberately in GBSP8P.ini, NOT in GBS.ini: the
# GBS.ini next to this file is loaded for every Beach Spikers region, so a code
# parked there would also be offered to (and applied to) an NTSC-U or NTSC-J
# disc at addresses that mean something else entirely. Keep region-specific
# codes in the region-specific file.
#
# The lines are Datel-encrypted ("XXXX-XXXX-XXXXX"), which Dolphin decrypts with
# ARDecrypt; the "Master code" from the forum post is omitted because Dolphin
# needs no master code and warns against enabling one.
